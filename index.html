<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Demonstração do sistema de gestão e agendamento Nuvé Studio.">

  <meta name="theme-color" content="#34233A">

  <title>Nuvé Studio | Acesse o App</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="index.css">

</head>


<body>

  <main class="access-page">

    <!-- =====================================================
         DECORAÇÃO
    ====================================================== -->

    <div class="background-decoration background-decoration--one" aria-hidden="true"></div>

    <div class="background-decoration background-decoration--two" aria-hidden="true"></div>


    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <section class="access-card">


      <!-- MARCA -->

      <div class="brand">

        <span class="brand-symbol" aria-hidden="true">
          N
        </span>


        <div class="brand-copy">

          <strong>
            Nuvé
          </strong>

          <span>
            Studio
          </span>

        </div>

      </div>


      <!-- CONTEÚDO PRINCIPAL -->

      <div class="access-content">

        <span class="access-eyebrow">
          Gestão & Agendamento
        </span>


        <h1>
          Seu estúdio,
          <span>
            organizado em um só lugar.
          </span>
        </h1>


        <p>
          Uma experiência simples para cuidar da agenda,
          dos clientes e da gestão do seu negócio.
        </p>

      </div>


      <!-- CTA -->

      <div class="access-actions">

        <button id="access-app-button" type="button" class="access-button">

          <span>
            Acessar o app
          </span>


          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">

            <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

            <path d="M14 7L19 12L14 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

          </svg>

        </button>


        <span class="demo-note">
          Demonstração interativa • nenhum cadastro necessário
        </span>

      </div>


      <!-- RODAPÉ -->

      <footer class="access-footer">

        <span>
          Nuvé Studio
        </span>

        <span class="footer-dot"></span>

        <span>
          Sistema demonstrativo
        </span>

      </footer>

    </section>

  </main>


  <script src="index.js"></script>

</body>

</html>
